<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1326"/>
      <stop offset="0.45" stop-color="#00478d"/>
      <stop offset="1" stop-color="#005eb8"/>
    </linearGradient>
    <!-- Blue wash over photo (right); solid brand blue on left for type -->
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#0b1326" stop-opacity="0.97"/>
      <stop offset="0.38" stop-color="#00478d" stop-opacity="0.94"/>
      <stop offset="0.62" stop-color="#005eb8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#005eb8" stop-opacity="0.82"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="320" y="0" width="704" height="500"/>
    </clipPath>
    <filter id="mono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <!-- Italian scene (replace feature-photo.jpg; keep licence on file) -->
  <image
    href="feature-photo.jpg"
    x="240"
    y="0"
    width="900"
    height="500"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#photoClip)"
    filter="url(#mono)"
  />
  <rect width="1024" height="500" fill="url(#blueWash)"/>
  <text x="72" y="200" fill="#ffffff" font-family="DM Sans, system-ui, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">ProntoExpat</text>
  <text x="72" y="252" fill="#d6e3ff" font-family="DM Sans, system-ui, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.5">Navigate life in Italy,</text>
  <text x="72" y="288" fill="#d6e3ff" font-family="DM Sans, system-ui, sans-serif" font-size="28" font-weight="500" letter-spacing="-0.5">one step at a time.</text>
  <text x="72" y="360" fill="#ffffff" fill-opacity="0.75" font-family="DM Sans, system-ui, sans-serif" font-size="18" font-weight="500">Personalised path with tasks, resources and reminders</text>
</svg>
